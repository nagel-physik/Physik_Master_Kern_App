<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Magnetfelder &amp; Induktion</title>
    <style>
        :root { --bg: #121212; --accent: #00ff88; --box: #1e1e1e; --text: #e0e0e0; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display:flex; flex-direction:column; align-items:center; min-height:100vh; box-sizing:border-box; }
        .container { max-width: 700px; width:100%; }
        .back-link { margin-bottom: 20px; }
        .back-link a { text-decoration: none; color: var(--accent); font-weight: bold; }

        h1 { color: var(--accent); text-align:center; }
        .progress { text-align:center; color:#888; margin-bottom: 20px; font-size:0.9rem; }

        .quiz-card { background: var(--box); border-radius: 15px; padding: 25px; border: 1px solid #333; }
        .question { font-size: 1.15rem; font-weight: bold; margin-bottom: 20px; }
        .option { display:block; width:100%; text-align:left; background:#2a2a2a; color:white; border:2px solid #444; border-radius:10px; padding:14px; margin-bottom:10px; cursor:pointer; font-size:1rem; transition: all 0.2s; }
        .option:hover { border-color: var(--accent); }
        .option.correct { background:#1e5e3a; border-color: var(--accent); }
        .option.wrong { background:#5e1e1e; border-color:#e74c3c; }
        .option:disabled { cursor: default; }

        .next-btn { margin-top:20px; width:100%; padding:14px; background: var(--accent); color:#000; border:none; border-radius:10px; font-weight:bold; font-size:1rem; cursor:pointer; display:none; }

        .score-screen { text-align:center; }
        .score-num { font-size: 3.5rem; color: var(--accent); font-weight:bold; }
        .retry-btn { margin-top:20px; padding:14px 30px; background:#333; color:white; border:none; border-radius:10px; font-weight:bold; cursor:pointer; }
        .retry-btn:hover { background: var(--accent); color:#000; }
    </style>
</head>
<body>

<div class="container">
    <div class="back-link"><a href="magnetismus.html">← ZURÜCK ZU MAGNETFELDER &amp; INDUKTION</a></div>
    <h1>🏆 Quiz: Magnetfelder &amp; Induktion</h1>
    <div class="progress" id="progress"></div>

    <div class="quiz-card" id="quizCard"></div>
</div>

<script>
const questions = [
    { q: "Die Pole eines Magneten heißen:", options: ["Plus- und Minuspol", "Ost- und Westpol", "Nord- und Südpol"], correct: 2 },
    { q: "Welcher Körper wird von einem Magneten angezogen?", options: ["ein Holzstab", "ein Eisennagel", "ein Kunststoffbecher"], correct: 1 },
    { q: "Eine frei bewegliche Kompassnadel zeigt immer:", options: ["den kürzesten Weg zum Ziel", "in Nord-Süd-Richtung", "entlang des Äquators"], correct: 1 },
    { q: "Elektromagnete bestehen im einfachsten Fall aus:", options: ["einem Dauermagneten", "einem stromdurchflossenen Leiter", "zwei nebeneinanderliegenden Magneten"], correct: 1 },
    { q: "Die magnetische Kraft eines Elektromagneten wird stärker, wenn ...", options: ["die Windungszahl der Spule sinkt", "die Stromstärke steigt", "man den Eisenkern entfernt"], correct: 1 },
    { q: "Als Magnetfeld bezeichnet man:", options: ["den vorderen Teil eines Magneten", "die Wirkung zwischen zwei Magneten direkt beim Berühren", "den Raum um einen Magneten, in dem Kräfte ohne direkten Kontakt wirken"], correct: 2 },
    { q: "Ein Elektromotor wandelt ...", options: ["chemische in elektrische Energie um", "elektrische in mechanische Energie um", "gar keine Energie um"], correct: 1 },
    { q: "Der Kommutator (Polwender) im Gleichstrommotor sorgt dafür, dass ...", options: ["der Rotor sich immer weiterdreht, statt stehen zu bleiben", "der Motor ausgeschaltet wird", "die Spannung erhöht wird"], correct: 0 },
    { q: "Elektromagnetische Induktion entsteht, wenn ...", options: ["sich ein Magnet und eine Spule relativ zueinander bewegen", "zwei Dauermagnete sich berühren", "Strom durch einen Isolator fließt"], correct: 0 },
    { q: "Die Induktionsspannung wird größer, wenn ...", options: ["der Magnet langsamer bewegt wird", "der Magnet schneller bewegt wird", "man den Magneten weiter weg hält und nicht bewegt"], correct: 1 },
    { q: "Wer entdeckte 1831 die elektromagnetische Induktion?", options: ["Christian Ørsted", "Michael Faraday", "Nikola Tesla"], correct: 1 },
    { q: "Ein U(t)-Diagramm einer Wechselspannung zeigt:", options: ["einen konstanten, waagerechten Verlauf", "einen periodischen Wechsel zwischen positiven und negativen Werten", "nur ansteigende Werte"], correct: 1 },
    { q: "Wozu dient ein Generator?", options: ["zum Verstärken von Musik", "zum reinen Weiterleiten von Strom", "zum Erzeugen einer elektrischen Spannung aus Bewegungsenergie"], correct: 2 },
    { q: "Für einen unbelasteten Transformator gilt:", options: ["N₁ × N₂ = U₁ × U₂", "N₁ / N₂ = U₁ / U₂", "N₁ + N₂ = U₁ + U₂"], correct: 1 },
    { q: "Ein Transformator kann betrieben werden mit:", options: ["nur Gleichspannung", "nur Wechselspannung", "sowohl Gleich- als auch Wechselspannung gleich gut"], correct: 1 }
];

let current = 0;
let score = 0;

function renderQuestion() {
    const card = document.getElementById('quizCard');
    document.getElementById('progress').innerText = 'Frage ' + (current + 1) + ' von ' + questions.length + '  |  Punkte: ' + score;

    if (current >= questions.length) {
        renderScore();
        return;
    }

    const item = questions[current];
    let html = '<div class="question">' + item.q + '</div>';
    item.options.forEach((opt, i) => {
        html += '<button class="option" onclick="checkAnswer(' + i + ')">' + opt + '</button>';
    });
    html += '<button class="next-btn" id="nextBtn" onclick="nextQuestion()">Weiter →</button>';
    card.innerHTML = html;
}

function checkAnswer(i) {
    const item = questions[current];
    const buttons = document.querySelectorAll('.option');
    buttons.forEach(b => b.disabled = true);

    if (i === item.correct) {
        buttons[i].classList.add('correct');
        score++;
    } else {
        buttons[i].classList.add('wrong');
        buttons[item.correct].classList.add('correct');
    }
    document.getElementById('nextBtn').style.display = 'block';
}

function nextQuestion() {
    current++;
    renderQuestion();
}

function renderScore() {
    const card = document.getElementById('quizCard');
    const percent = Math.round((score / questions.length) * 100);
    let feedback = '';
    if (percent >= 90) feedback = 'Stark! Du kennst dich mit Magnetfeldern & Induktion richtig gut aus. 💪';
    else if (percent >= 60) feedback = 'Gut gemacht! Schau dir die Themen, bei denen es haperte, noch einmal an.';
    else feedback = "Das war ein guter Start – geh die Stationen noch einmal in Ruhe durch, dann klappt's beim nächsten Mal besser.";

    card.innerHTML = `
        <div class="score-screen">
            <div class="score-num">${score} / ${questions.length}</div>
            <p>${percent}% richtig</p>
            <p>${feedback}</p>
            <button class="retry-btn" onclick="restartQuiz()">Nochmal versuchen</button>
        </div>`;
    document.getElementById('progress').innerText = 'Quiz beendet';
}

function restartQuiz() {
    current = 0;
    score = 0;
    renderQuestion();
}

renderQuestion();
</script>

</body>
</html>
