<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Optik</title>
    <style>
        :root { --bg: #121212; --accent: #00ff88; --box: #1e1e1e; --text: #e0e0e0; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display:flex; flex-direction:column; align-items:center; min-height:100vh; box-sizing:border-box; }
        .container { max-width: 700px; width:100%; }
        .back-link { margin-bottom: 20px; }
        .back-link a { text-decoration: none; color: var(--accent); font-weight: bold; }

        h1 { color: var(--accent); text-align:center; }
        .progress { text-align:center; color:#888; margin-bottom: 20px; font-size:0.9rem; }

        .quiz-card { background: var(--box); border-radius: 15px; padding: 25px; border: 1px solid #333; }
        .question { font-size: 1.15rem; font-weight: bold; margin-bottom: 20px; }
        .option { display:block; width:100%; text-align:left; background:#2a2a2a; color:white; border:2px solid #444; border-radius:10px; padding:14px; margin-bottom:10px; cursor:pointer; font-size:1rem; transition: all 0.2s; }
        .option:hover { border-color: var(--accent); }
        .option.correct { background:#1e5e3a; border-color: var(--accent); }
        .option.wrong { background:#5e1e1e; border-color:#e74c3c; }
        .option:disabled { cursor: default; }

        .next-btn { margin-top:20px; width:100%; padding:14px; background: var(--accent); color:#000; border:none; border-radius:10px; font-weight:bold; font-size:1rem; cursor:pointer; display:none; }

        .score-screen { text-align:center; }
        .score-num { font-size: 3.5rem; color: var(--accent); font-weight:bold; }
        .retry-btn { margin-top:20px; padding:14px 30px; background:#333; color:white; border:none; border-radius:10px; font-weight:bold; cursor:pointer; }
        .retry-btn:hover { background: var(--accent); color:#000; }
    </style>
</head>
<body>

<div class="container">
    <div class="back-link"><a href="optik.html">← ZURÜCK ZU OPTIK</a></div>
    <h1>🏆 Quiz: Optik</h1>
    <div class="progress" id="progress"></div>

    <div class="quiz-card" id="quizCard"></div>
</div>

<script>
const questions = [
    { q: "Ein Körper, der selbst Licht aussendet, heißt ...", options: ["beleuchteter Körper", "selbstleuchtender Körper", "durchsichtiger Körper"], correct: 1 },
    { q: "Licht breitet sich in einem durchsichtigen Stoff ... aus.", options: ["wellenförmig", "geradlinig", "kreisförmig"], correct: 1 },
    { q: "Die Lichtgeschwindigkeit im Vakuum beträgt etwa ...", options: ["300 000 km/s", "300 000 km/h", "343 m/s"], correct: 0 },
    { q: "Ein Bereich hinter einem Hindernis, den überhaupt kein Licht der Quelle erreicht, heißt ...", options: ["Halbschatten", "Kernschatten", "Lichtbündel"], correct: 1 },
    { q: "Bei einer Sonnenfinsternis steht ...", options: ["die Erde zwischen Sonne und Mond", "der Mond zwischen Sonne und Erde", "die Sonne zwischen Erde und Mond"], correct: 1 },
    { q: "Das Reflexionsgesetz lautet:", options: ["Einfallswinkel = Ausfallswinkel", "Einfallswinkel = 2 · Ausfallswinkel", "Einfallswinkel + Ausfallswinkel = 90°"], correct: 0 },
    { q: "Das Bild eines ebenen Spiegels ist ...", options: ["reell und umgekehrt", "virtuell, gleich groß und seitenvertauscht", "virtuell und vergrößert"], correct: 1 },
    { q: "Brechung tritt auf, wenn Licht ...", options: ["auf einen Spiegel trifft", "von einem durchsichtigen Stoff in einen anderen übergeht", "von einer Lichtquelle ausgesendet wird"], correct: 1 },
    { q: "Totalreflexion kann auftreten, wenn Licht ...", options: ["vom optisch dünneren in den optisch dichteren Stoff übergeht", "vom optisch dichteren in den optisch dünneren Stoff übergeht und der Grenzwinkel überschritten wird", "senkrecht auf eine Grenzfläche trifft"], correct: 1 },
    { q: "Ein Hohlspiegel bündelt parallel einfallende Strahlen in ...", options: ["der Spiegelmitte", "dem Brennpunkt", "einem virtuellen Punkt hinter dem Spiegel"], correct: 1 },
    { q: "Ist die Gegenstandsweite g einer Sammellinse kleiner als die Brennweite f, entsteht ein ...", options: ["reelles, umgekehrtes Bild", "virtuelles, vergrößertes, aufrechtes Bild", "virtuelles, verkleinertes Bild"], correct: 1 },
    { q: "Die Linsengleichung lautet:", options: ["1/f = 1/g + 1/b", "f = g + b", "1/f = g · b"], correct: 0 },
    { q: "Für den Abbildungsmaßstab gilt:", options: ["B/G = b/g", "B/G = g/b", "B · G = b · g"], correct: 0 },
    { q: "Die Vergrößerung einer Lupe berechnet man mit:", options: ["V = f / s₀", "V = s₀ / f", "V = s₀ · f"], correct: 1 },
    { q: "Die additiven Grundfarben des Lichts sind:", options: ["Cyan, Magenta, Gelb", "Rot, Grün, Blau", "Rot, Gelb, Blau"], correct: 1 }
];

let current = 0;
let score = 0;

function renderQuestion() {
    const card = document.getElementById('quizCard');
    document.getElementById('progress').innerText = 'Frage ' + (current + 1) + ' von ' + questions.length + '  |  Punkte: ' + score;

    if (current >= questions.length) {
        renderScore();
        return;
    }

    const item = questions[current];
    let html = '<div class="question">' + item.q + '</div>';
    item.options.forEach((opt, i) => {
        html += '<button class="option" onclick="checkAnswer(' + i + ')">' + opt + '</button>';
    });
    html += '<button class="next-btn" id="nextBtn" onclick="nextQuestion()">Weiter →</button>';
    card.innerHTML = html;
}

function checkAnswer(i) {
    const item = questions[current];
    const buttons = document.querySelectorAll('.option');
    buttons.forEach(b => b.disabled = true);

    if (i === item.correct) {
        buttons[i].classList.add('correct');
        score++;
    } else {
        buttons[i].classList.add('wrong');
        buttons[item.correct].classList.add('correct');
    }
    document.getElementById('nextBtn').style.display = 'block';
}

function nextQuestion() {
    current++;
    renderQuestion();
}

function renderScore() {
    const card = document.getElementById('quizCard');
    const percent = Math.round((score / questions.length) * 100);
    let feedback = "";
    if (percent >= 90) feedback = "Stark! Du kennst dich mit der Optik richtig gut aus. 💪";
    else if (percent >= 60) feedback = "Gut gemacht! Schau dir die Themen, bei denen es haperte, noch einmal an.";
    else feedback = "Das war ein guter Start – geh die Stationen noch einmal in Ruhe durch, dann klappt es beim nächsten Mal besser.";

    card.innerHTML = `
        <div class="score-screen">
            <div class="score-num">${score} / ${questions.length}</div>
            <p>${percent}% richtig</p>
            <p>${feedback}</p>
            <button class="retry-btn" onclick="restartQuiz()">Nochmal versuchen</button>
        </div>`;
    document.getElementById('progress').innerText = 'Quiz beendet';
}

function restartQuiz() {
    current = 0;
    score = 0;
    renderQuestion();
}

renderQuestion();
</script>

</body>
</html>
