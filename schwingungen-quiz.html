<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Schwingungen &amp; Wellen</title>
    <style>
        :root { --bg: #121212; --accent: #00ff88; --box: #1e1e1e; --text: #e0e0e0; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display:flex; flex-direction:column; align-items:center; min-height:100vh; box-sizing:border-box; }
        .container { max-width: 700px; width:100%; }
        .back-link { margin-bottom: 20px; }
        .back-link a { text-decoration: none; color: var(--accent); font-weight: bold; }

        h1 { color: var(--accent); text-align:center; }
        .progress { text-align:center; color:#888; margin-bottom: 20px; font-size:0.9rem; }

        .quiz-card { background: var(--box); border-radius: 15px; padding: 25px; border: 1px solid #333; }
        .question { font-size: 1.15rem; font-weight: bold; margin-bottom: 20px; }
        .option { display:block; width:100%; text-align:left; background:#2a2a2a; color:white; border:2px solid #444; border-radius:10px; padding:14px; margin-bottom:10px; cursor:pointer; font-size:1rem; transition: all 0.2s; }
        .option:hover { border-color: var(--accent); }
        .option.correct { background:#1e5e3a; border-color: var(--accent); }
        .option.wrong { background:#5e1e1e; border-color:#e74c3c; }
        .option:disabled { cursor: default; }

        .next-btn { margin-top:20px; width:100%; padding:14px; background: var(--accent); color:#000; border:none; border-radius:10px; font-weight:bold; font-size:1rem; cursor:pointer; display:none; }

        .score-screen { text-align:center; }
        .score-num { font-size: 3.5rem; color: var(--accent); font-weight:bold; }
        .retry-btn { margin-top:20px; padding:14px 30px; background:#333; color:white; border:none; border-radius:10px; font-weight:bold; cursor:pointer; }
        .retry-btn:hover { background: var(--accent); color:#000; }
    </style>
</head>
<body>

<div class="container">
    <div class="back-link"><a href="schwingungen.html">← ZURÜCK ZU SCHWINGUNGEN &amp; WELLEN</a></div>
    <h1>🏆 Quiz: Schwingungen &amp; Wellen</h1>
    <div class="progress" id="progress"></div>

    <div class="quiz-card" id="quizCard"></div>
</div>

<script>
const questions = [
    { q: "Eine Kinderschaukel ... hin und her.", options: ["wackelt", "schwingt", "schwebt"], correct: 1 },
    { q: "Der Begriff „periodisch“ sagt uns, dass ...", options: ["sich ein Körper zur Ruhe legt", "sich ein Ablauf wiederholt", "eine Bewegung immer schneller wird"], correct: 1 },
    { q: "Die Amplitude einer Schwingung ist ...", options: ["der Abstand zwischen den beiden Umkehrpunkten", "die Zeitspanne bis zum gleichen Umkehrpunkt", "der größte Abstand zwischen Ruhelage und Umkehrpunkt"], correct: 2 },
    { q: "Die Periodendauer eines Fadenpendels hängt ab von ...", options: ["der Masse des Pendelkörpers", "der Länge des Pendels", "der Farbe des Pendelkörpers"], correct: 1 },
    { q: "Eine Schwingung, deren Amplitude mit der Zeit abnimmt, nennt man ...", options: ["ungedämpft", "gedämpft", "harmonisch"], correct: 1 },
    { q: "Resonanz tritt ein, wenn ...", options: ["Erregerfrequenz = Eigenfrequenz gilt", "die Erregerfrequenz doppelt so groß wie die Eigenfrequenz ist", "die Amplitude null ist"], correct: 0 },
    { q: "Schall ist ...", options: ["die Fortbewegung von Luftteilchen selbst", "eine Form hörbarer Strahlung", "die Ausbreitung einer Schwingung als Welle"], correct: 2 },
    { q: "Schallwellen breiten sich in Luft (20 °C) aus mit etwa:", options: ["340 km/s", "343 m/s", "340 km/h"], correct: 1 },
    { q: "Bei Längswellen erfolgt die Schwingung ...", options: ["quer zur Ausbreitungsrichtung", "in Ausbreitungsrichtung", "gar nicht, nur die Energie wandert"], correct: 1 },
    { q: "Zu einer Reflexion von Wellen kommt es, wenn ...", options: ["sich zwei Wellen im Raum überlagern", "Wellen auf ein Hindernis treffen", "eine Welle sich einfach nur ausbreitet"], correct: 1 },
    { q: "Wenn sich zwei Schallwellen überlagern, können sie sich verstärken oder abschwächen. Das nennt man:", options: ["Interferenz", "Brechung", "Beugung"], correct: 0 },
    { q: "Treffen Wellen auf einen Spalt oder eine Kante und dringen dabei in den Schattenraum ein, nennt man das:", options: ["Brechung", "Beugung", "Interferenz"], correct: 1 },
    { q: "Die Ausbreitungsgeschwindigkeit einer Welle berechnet man mit:", options: ["c = λ / f", "c = λ · f", "c = λ + f"], correct: 1 },
    { q: "Ändern sich beim Übergang einer Welle von einem Stoff in einen anderen Ausbreitungsrichtung und Kenngrößen, nennt man das:", options: ["Beugung", "Brechung", "Reflexion"], correct: 1 },
    { q: "Ein Kind wird auf der Schaukel immer genau im richtigen Moment angeschoben und schwingt dadurch immer höher. Das ist ein Beispiel für:", options: ["Dämpfung", "Resonanz", "Brechung"], correct: 1 }
];

let current = 0;
let score = 0;

function renderQuestion() {
    const card = document.getElementById('quizCard');
    document.getElementById('progress').innerText = 'Frage ' + (current + 1) + ' von ' + questions.length + '  |  Punkte: ' + score;

    if (current >= questions.length) {
        renderScore();
        return;
    }

    const item = questions[current];
    let html = '<div class="question">' + item.q + '</div>';
    item.options.forEach((opt, i) => {
        html += '<button class="option" onclick="checkAnswer(' + i + ')">' + opt + '</button>';
    });
    html += '<button class="next-btn" id="nextBtn" onclick="nextQuestion()">Weiter →</button>';
    card.innerHTML = html;
}

function checkAnswer(i) {
    const item = questions[current];
    const buttons = document.querySelectorAll('.option');
    buttons.forEach(b => b.disabled = true);

    if (i === item.correct) {
        buttons[i].classList.add('correct');
        score++;
    } else {
        buttons[i].classList.add('wrong');
        buttons[item.correct].classList.add('correct');
    }
    document.getElementById('nextBtn').style.display = 'block';
}

function nextQuestion() {
    current++;
    renderQuestion();
}

function renderScore() {
    const card = document.getElementById('quizCard');
    const percent = Math.round((score / questions.length) * 100);
    let feedback = '';
    if (percent >= 90) feedback = "Stark! Du kennst dich mit Schwingungen und Wellen richtig gut aus. 💪";
    else if (percent >= 60) feedback = "Gut gemacht! Schau dir die Themen, bei denen es haperte, noch einmal an.";
    else feedback = "Das war ein guter Start – geh die Stationen noch einmal in Ruhe durch, dann klappt es beim nächsten Mal besser.";

    card.innerHTML = `
        <div class="score-screen">
            <div class="score-num">${score} / ${questions.length}</div>
            <p>${percent}% richtig</p>
            <p>${feedback}</p>
            <button class="retry-btn" onclick="restartQuiz()">Nochmal versuchen</button>
        </div>`;
    document.getElementById('progress').innerText = 'Quiz beendet';
}

function restartQuiz() {
    current = 0;
    score = 0;
    renderQuestion();
}

renderQuestion();
</script>

</body>
</html>
